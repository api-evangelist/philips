apis:
  - aid: philips:hsdp
    name: Philips HealthSuite Digital Platform (HSDP)
    description: >-
      HSDP is Philips' cloud platform for building connected health
      applications. It packages a suite of building-block services -
      including Identity and Access Management, Provisioning, IoT/Connect for
      device data ingestion, Foundation (logging, audit, blob storage),
      Cognitive (AI inference), Clinical Data Repository, and Notification -
      behind a customer-portal-gated developer experience. Customers and
      partners access detailed API documentation and credentials through the
      authenticated portal at www.hsdp.io; the platform also publishes a
      status page at status.hsdp.io. Philips does not currently publish HSDP
      OpenAPI specifications openly on the public web.
    humanURL: https://www.hsdp.io/
