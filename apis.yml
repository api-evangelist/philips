aid: philips
name: Philips
description: >-
  A Dutch multinational health technology company focused on diagnostic imaging,
  patient monitoring, image-guided therapy, ultrasound, sleep and respiratory
  care, and connected care solutions. Philips transitioned from a diversified
  electronics conglomerate to a dedicated healthcare technology leader and
  operates the HealthSuite Digital Platform (HSDP) as its cloud-based platform
  for connected health applications. HSDP exposes Identity & Access Management,
  Provisioning, IoT/Connect, Foundation, Cognitive, Clinical Data, and
  Notification building blocks to enable consumer health and professional
  healthcare applications, but access is gated behind a customer portal at
  www.hsdp.io with developer documentation distributed to authenticated
  customers and partners rather than the open public web. Philips also operates
  vertical Connected Care offerings (Patient Monitoring, eICU/Capsule, Sleep &
  Respiratory Care/SimplyGo, IntelliSpace) layered on HSDP. The legacy Philips
  Hue lighting API is no longer a Philips offering - Hue has been spun off into
  Signify and is published at developers.meethue.com.
